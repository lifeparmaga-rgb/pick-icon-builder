name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyinstaller tkinterdnd2 pillow

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --collect-all tkinterdnd2 pick_icon_pro_dnd.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pick_icon_exe
        path: dist/*.exe
